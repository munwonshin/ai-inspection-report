name: Windows executable release

on:
  workflow_dispatch:
  push:
    branches: [main, codex/c1-source-review, codex/r028-save-hardening]
    paths:
      - '.github/workflows/windows-release.yml'
      - '.gitattributes'
      - 'main.py'
      - 'inspection/**'
      - 'hooks/**'
      - 'build.ps1'
      - 'requirements.txt'
      - 'qa/verify_frozen.py'
      - 'qa/package_release.py'
      - 'install-support.cs'
      - '바탕화면 아이콘 만들기.cmd'

permissions:
  contents: read

concurrency:
  group: windows-executable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref != 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test and build Windows application
        run: ./build.ps1
      - name: Check bundled GUI and TLS runtime
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Join-Path $env:RUNNER_TEMP 'runtime-check.json'
          $exe = (Resolve-Path 'dist/AIInspectionReport/AIInspectionReport.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--runtime-check', $result -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $result)) { throw 'Bundled runtime check failed' }
          $runtime = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          if (-not $runtime.tkdnd -or -not $runtime.tls) { throw 'Missing bundled GUI/TLS dependency' }
      - name: Package candidate (does not publish)
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & ./.venv/Scripts/python.exe -c "from inspection.desktop_shortcut import VERSION; print(VERSION)"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          & ./.venv/Scripts/python.exe qa/package_release.py dist/AIInspectionReport $version
          if ($LASTEXITCODE -ne 0) { throw 'Release package verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tested candidate and publish exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f release/approved.json
          test -f release/NOTES.md
          test "$(jq -r .version release/approved.json)" = "0.4.28"
          jq -e '.schema == "c1-tested-release-v1" and .frozen_e2e == "PASS" and .unit_tests == 163 and .acceptance_tests == 28 and .gui_qa == 4' release/approved.json >/dev/null
          SOURCE=$(jq -r .source_commit release/approved.json)
          RUN=$(jq -r .workflow_run_id release/approved.json)
          VERSION=$(jq -r .version release/approved.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git cat-file -e "$SOURCE^{commit}"
          git diff --exit-code "$SOURCE" HEAD -- main.py inspection requirements.txt build.ps1 hooks assets qa/verify_frozen.py qa/package_release.py install-support.cs '바탕화면 아이콘 만들기.cmd'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" > /tmp/candidate-run.json
          jq -e --arg source "$SOURCE" '.head_sha == $source and .conclusion == "success" and .head_branch == "codex/r028-save-hardening"' /tmp/candidate-run.json >/dev/null
          mkdir verified-release
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name windows-release --dir verified-release
          cd verified-release
          ZIP="AIInspectionReport-$VERSION-windows-x64.zip"
          EXPECTED=$(jq -r .zip_sha256 ../release/approved.json)
          printf '%s  %s\n' "$EXPECTED" "$ZIP" | sha256sum --check -
          sha256sum --check SHA256SUMS.txt
          EXPECTED_EXE=$(jq -r .exe_sha256 ../release/approved.json)
          ACTUAL_EXE=$(unzip -p "$ZIP" AIInspectionReport/AIInspectionReport.exe | sha256sum | cut -d' ' -f1)
          test "$EXPECTED_EXE" = "$ACTUAL_EXE"
          gh release create "v$VERSION" "$ZIP" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AI 현장점검 결과서 $VERSION · 저장 작업 보호" --notes-file ../release/NOTES.md --latest
